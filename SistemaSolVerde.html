<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sol & Verde - Sistema de Cuenta Corriente</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cleave.js/1.6.0/cleave.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================================================================
       VARIABLES CSS - TEMA CLARO/OSCURO
       ============================================================================ */
    :root {
      /* Colores Corporativos */
      --sv-primario: #2E7D32;
      --sv-primario-claro: #4CAF50;
      --sv-primario-oscuro: #1B5E20;
      --sv-secundario: #FF6F00;
      --sv-exito: #4CAF50;
      --sv-peligro: #C62828;
      --sv-advertencia: #FBC02D;
      --sv-info: #00ACC1;

      /* Tema Claro (default) */
      --sv-fondo: #F1F8E9;
      --sv-superficie: #FFFFFF;
      --sv-superficie-elevada: #FAFAFA;
      --sv-borde: #C8E6C9;
      --sv-texto: #1B5E20;
      --sv-texto-secundario: #558B2F;
      --sv-texto-muted: #81C784;
      --sv-sombra: rgba(46, 125, 50, 0.15);

      /* Dimensiones */
      --sv-header-height: 60px;
      --sv-sidebar-width: 260px;
      --sv-radius: 8px;
      --sv-transition: 0.25s ease;
      --sv-touch-target: 48px;

      /* Breakpoints (referencia documental; media queries usan px fijos) */
      --sv-bp-sm: 480px;
      --sv-bp-md: 768px;
      --sv-bp-lg: 1024px;

      /* Safe area (notch / home indicator) */
      --sv-safe-top: env(safe-area-inset-top, 0px);
      --sv-safe-right: env(safe-area-inset-right, 0px);
      --sv-safe-bottom: env(safe-area-inset-bottom, 0px);
      --sv-safe-left: env(safe-area-inset-left, 0px);

      /* Altura útil en móviles (barra del navegador) */
      --sv-app-height: 100dvh;
    }

    [data-theme="dark"] {
      --sv-fondo: #0D1B0E;
      --sv-superficie: #1A3D1C;
      --sv-superficie-elevada: #2E5930;
      --sv-borde: #4A7C4E;
      --sv-texto: #E8F5E9;
      --sv-texto-secundario: #A5D6A7;
      --sv-texto-muted: #66BB6A;
      --sv-sombra: rgba(0, 0, 0, 0.3);
    }

    /* ============================================================================
       RESET Y BASE
       ============================================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--sv-fondo);
      color: var(--sv-texto);
      min-height: 100vh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      padding-left: var(--sv-safe-left);
      padding-right: var(--sv-safe-right);
      transition: background var(--sv-transition), color var(--sv-transition);
      overflow-x: hidden;
    }

    /* ============================================================================
       SPLASH SCREEN
       ============================================================================ */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--sv-primario-oscuro) 0%, var(--sv-primario) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #splashScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: white;
      margin-bottom: 1rem;
      text-align: center;
    }

    .splash-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================================================
       LAYOUT PRINCIPAL
       ============================================================================ */
    #appContainer {
      display: none;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #appContainer.visible {
      display: block;
    }

    /* Header */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--sv-header-height) + var(--sv-safe-top));
      min-height: calc(var(--sv-header-height) + var(--sv-safe-top));
      padding-top: var(--sv-safe-top);
      padding-left: max(0.75rem, var(--sv-safe-left));
      padding-right: max(0.75rem, var(--sv-safe-right));
      background: var(--sv-primario);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0;
      gap: 0.75rem;
      z-index: 100;
      box-shadow: 0 2px 8px var(--sv-sombra);
      box-sizing: border-box;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .header-logo:hover {
      opacity: 0.85;
    }

    .header-logo-img {
      height: 36px;
      width: auto;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .header-logo-text {
      font-size: 1.125rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      min-width: var(--sv-touch-target);
      min-height: var(--sv-touch-target);
      width: var(--sv-touch-target);
      height: var(--sv-touch-target);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.25rem;
      transition: background var(--sv-transition);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-btn:hover, .header-btn:active {
      background: rgba(255,255,255,0.25);
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: calc(var(--sv-header-height) + var(--sv-safe-top));
      left: 0;
      bottom: 0;
      width: var(--sv-sidebar-width);
      max-width: min(var(--sv-sidebar-width), calc(100vw - var(--sv-safe-left) - var(--sv-safe-right)));
      padding-bottom: var(--sv-safe-bottom);
      background: var(--sv-superficie);
      border-right: 1px solid var(--sv-borde);
      overflow-y: auto;
      transition: transform var(--sv-transition);
      z-index: 90;
      -webkit-overflow-scrolling: touch;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      top: calc(var(--sv-header-height) + var(--sv-safe-top));
      background: rgba(0,0,0,0.5);
      z-index: 85;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .menu-section {
      padding: 1rem 0;
      border-bottom: 1px solid var(--sv-borde);
    }

    .menu-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--sv-texto-muted);
      padding: 0 1rem;
      margin-bottom: 0.5rem;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      min-height: var(--sv-touch-target);
      color: var(--sv-texto);
      text-decoration: none;
      cursor: pointer;
      transition: background var(--sv-transition), transform var(--sv-transition);
    }

    .menu-item:hover {
      background: var(--sv-superficie-elevada);
    }

    .menu-item:active {
      transform: scale(0.98);
    }

    .menu-item.active {
      background: var(--sv-primario);
      color: white;
    }

    .menu-icon {
      font-size: 1.25rem;
      width: 1.5rem;
      text-align: center;
    }

    /* Main Content */
    .main-content {
      margin-left: var(--sv-sidebar-width);
      margin-top: calc(var(--sv-header-height) + var(--sv-safe-top));
      padding: 1rem;
      padding-bottom: calc(1rem + var(--sv-safe-bottom));
      min-height: calc(100dvh - var(--sv-header-height) - var(--sv-safe-top));
      min-height: calc(100vh - var(--sv-header-height) - var(--sv-safe-top));
      transition: margin var(--sv-transition);
    }

    .sidebar.collapsed + .main-content {
      margin-left: 0;
    }

    /* ============================================================================
       RESPONSIVE - MOBILE FIRST
       ============================================================================ */
    @media (max-width: 768px) {
      :root {
        --sv-sidebar-width: 280px;
        --sv-touch-target: 52px; /* Botones más grandes en tablets */
      }

      .header-logo-text {
        font-size: 1rem;
      }

      .sidebar {
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 12px var(--sv-sombra);
        z-index: 220;
      }

      .sidebar-overlay.active {
        z-index: 210;
      }

      .main-content {
        margin-left: 0;
        padding: 0.75rem;
        padding-left: max(0.75rem, var(--sv-safe-left));
        padding-right: max(0.75rem, var(--sv-safe-right));
      }

      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: 1fr;
      }

      /* Formularios más táctiles */
      .form-input, .form-select, .form-textarea {
        font-size: 16px; /* Evita zoom en iOS */
        padding: 1rem;
      }

      /* Tablas más compactas */
      .table-container {
        margin: 0 -0.75rem;
        padding: 0 0.75rem;
      }
    }

    @media (max-width: 480px) {
      :root {
        --sv-touch-target: 56px; /* Botones extra grandes en móviles */
      }

      .header-logo-text {
        display: none;
      }

      .main-content {
        padding: 0.5rem;
      }

      .card {
        padding: 1rem;
        margin-bottom: 1rem;
      }

      /* Botones a ancho completo solo donde se pide explícitamente (evita barras de herramientas rotas) */
      .form-actions-stacked > .btn:not(.btn-sm),
      .btn-block-sm {
        width: 100%;
        justify-content: center;
      }

      .toolbar-responsive {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: stretch;
      }

      .toolbar-responsive > .btn:not(.btn-sm) {
        flex: 1 1 auto;
        min-width: min(100%, 7.5rem);
        max-width: 100%;
        width: auto;
      }

      .btn-group {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .btn-group > .btn {
        flex: 1 1 auto;
        min-width: min(100%, 100px);
        max-width: 100%;
        width: auto;
      }

      /* Inputs más grandes */
      .form-input, .form-select {
        font-size: 16px;
      }

      /* Modales fullscreen en móvil */
      .modal-content {
        max-width: 100%;
        max-height: 100dvh;
        max-height: 100vh;
        border-radius: 0;
      }
    }

    /* ============================================================================
       RESPONSIVE: TABLET (768px - 1199px)
       ============================================================================ */
    @media (min-width: 768px) and (max-width: 1199px) {
      :root { --sv-sidebar-width: 60px; }

      .menu-item span,
      .menu-section-title {
        display: none;
      }

      .menu-item {
        justify-content: center;
        padding: 0.75rem;
      }

      .menu-item-icon {
        margin: 0;
        font-size: 1.4rem;
      }

      .grid-3, .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ============================================================================
       RESPONSIVE: MOBILE (<767px) — complementos
       ============================================================================ */
    @media (max-width: 767px) {
      /* Modales como bottom sheet en móvil */
      .modal {
        align-items: flex-end;
        padding: 0 max(0.5rem, var(--sv-safe-left)) max(0.5rem, var(--sv-safe-bottom)) max(0.5rem, var(--sv-safe-right));
      }
      .modal-content {
        border-radius: var(--sv-radius) var(--sv-radius) 0 0;
        max-height: min(90dvh, 90vh);
        width: 100%;
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
      }

      /* Botones de acción primaria: mínimo 44px */
      .btn {
        min-height: 44px;
      }

      /* Área táctil mínima para botones (excepto cabecera circular) */
      button:not(.header-btn) {
        min-height: 44px;
      }

      .app-header .header-btn {
        min-height: var(--sv-touch-target);
        min-width: var(--sv-touch-target);
        width: var(--sv-touch-target);
        height: var(--sv-touch-target);
      }

      /* Config tabs: scroll horizontal en mobile */
      .config-tabs-nav {
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      /* Sort controls: wrap mejor en mobile */
      .sort-controls {
        flex-wrap: wrap;
      }
    }

    /* ============================================================================
       COMPONENTES
       ============================================================================ */

    /* Cards */
    .card {
      background: var(--sv-superficie);
      border-radius: var(--sv-radius);
      border: 1px solid var(--sv-borde);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px var(--sv-sombra);
      animation: slideUp 0.3s ease;
    }

    .card-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--sv-primario);
    }

    /* Formularios */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--sv-texto-secundario);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.875rem;
      min-height: var(--sv-touch-target);
      border: 1px solid var(--sv-borde);
      border-radius: var(--sv-radius);
      background: var(--sv-superficie);
      color: var(--sv-texto);
      font-size: 1rem;
      transition: border-color var(--sv-transition), box-shadow var(--sv-transition);
      -webkit-appearance: none;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--sv-primario);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
    }

    .form-input::placeholder {
      color: var(--sv-texto-muted);
    }

    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      min-height: var(--sv-touch-target);
      border: none;
      border-radius: var(--sv-radius);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--sv-transition);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--sv-primario);
      color: white;
    }

    .btn-primary:hover, .btn-primary:active {
      background: var(--sv-primario-oscuro);
    }

    .btn-secondary {
      background: var(--sv-secundario);
      color: white;
    }

    .btn-secondary:hover {
      background: #E65100;
    }

    .btn-danger {
      background: var(--sv-peligro);
      color: white;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--sv-borde);
      color: var(--sv-texto);
    }

    .btn-outline:hover, .btn-outline:active {
      background: var(--sv-superficie-elevada);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      min-height: 40px;
      font-size: 0.875rem;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Tablas - Desktop */
    .table-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -1rem;
      padding: 0 1rem;
      max-width: 100%;
      box-sizing: content-box;
    }

    /* Indicador sutil de scroll horizontal en tablas anchas */
    .table-container.sv-scroll-hint {
      background:
        linear-gradient(to right, var(--sv-superficie) 0, rgba(255,255,255,0) 12px) left,
        linear-gradient(to left, var(--sv-superficie) 0, rgba(255,255,255,0) 12px) right;
      background-size: 16px 100%;
      background-repeat: no-repeat;
      background-attachment: local, local;
    }

    [data-theme="dark"] .table-container.sv-scroll-hint {
      background:
        linear-gradient(to right, var(--sv-superficie) 0, rgba(26,61,28,0) 12px) left,
        linear-gradient(to left, var(--sv-superficie) 0, rgba(26,61,28,0) 12px) right;
      background-size: 16px 100%;
      background-repeat: no-repeat;
      background-attachment: local, local;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    .table th, .table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--sv-borde);
    }

    .table th {
      background: var(--sv-superficie-elevada);
      font-weight: 600;
      color: var(--sv-primario);
      font-size: 0.875rem;
      white-space: nowrap;
    }

    .table tr:active {
      background: var(--sv-superficie-elevada);
    }

    /* Tablas - Responsive Cards para movil */
    @media (max-width: 768px) {
      .table-responsive-cards {
        min-width: auto;
      }

      .table-responsive-cards thead {
        display: none;
      }

      .table-responsive-cards tbody tr {
        display: block;
        background: var(--sv-superficie);
        border: 1px solid var(--sv-borde);
        border-radius: var(--sv-radius);
        margin-bottom: 0.75rem;
        padding: 0.75rem;
      }

      .table-responsive-cards td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid var(--sv-borde);
      }

      .table-responsive-cards td:last-child {
        border-bottom: none;
      }

      .table-responsive-cards td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--sv-texto-secundario);
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      .table-responsive-cards td:last-child {
        justify-content: flex-end;
      }
    }

    /* Tags */
    .tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .tag-debe, .tag-fiado {
      background: #FFEBEE;
      color: #C62828;
    }

    .tag-haber, .tag-pago {
      background: #E8F5E9;
      color: #2E7D32;
    }

    [data-theme="dark"] .tag-debe, [data-theme="dark"] .tag-fiado {
      background: rgba(198, 40, 40, 0.3);
    }

    [data-theme="dark"] .tag-haber, [data-theme="dark"] .tag-pago {
      background: rgba(46, 125, 50, 0.3);
    }

    /* Grid */
    .grid {
      display: grid;
      gap: 1rem;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    /* Modulos */
    .module-view {
      display: none;
    }

    .module-view.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: max(1rem, var(--sv-safe-bottom));
      left: max(1rem, var(--sv-safe-left));
      right: max(1rem, var(--sv-safe-right));
      z-index: 10050;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }

    @media (min-width: 481px) {
      .toast-container {
        left: auto;
        width: 320px;
      }
    }

    .toast {
      background: var(--sv-superficie);
      border: 1px solid var(--sv-borde);
      border-radius: var(--sv-radius);
      padding: 1rem;
      box-shadow: 0 4px 12px var(--sv-sombra);
      animation: slideIn 0.3s ease;
      will-change: transform, opacity; /* FASE 4: Hardware acceleration */
      pointer-events: auto;
    }

    .toast-success { border-left: 4px solid var(--sv-exito); }
    .toast-error { border-left: 4px solid var(--sv-peligro); }
    .toast-warning { border-left: 4px solid var(--sv-advertencia); }
    .toast-info { border-left: 4px solid var(--sv-info); }

    /* Animaciones Mejoradas */
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideInLeft {
      from { transform: translateX(-30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .fadeOut {
      animation: fadeOut 0.3s ease forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }

    /* ============================================================================
       ANIMACION DE NAVEGACION ENTRE MODULOS
       ============================================================================ */
    @keyframes moduleSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.99);
        filter: blur(1px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .module-view.active {
      animation: moduleSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    /* Transición de splash mejorada */
    #splashScreen {
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #splashScreen.hidden {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    /* Skeleton loading para tablas mientras cargan datos */
    .loading-skeleton tbody tr td {
      background: linear-gradient(90deg,
        var(--sv-superficie-elevada) 25%,
        var(--sv-borde) 50%,
        var(--sv-superficie-elevada) 75%
      );
      background-size: 400% 100%;
      animation: skeletonPulse 1.4s ease infinite;
      color: transparent !important;
      border-radius: 4px;
      pointer-events: none;
    }

    @keyframes skeletonPulse {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Toast con animación mejorada */
    @keyframes toastIn {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateX(0);    opacity: 1; }
      to   { transform: translateX(110%); opacity: 0; }
    }

    .toast {
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.fadeOut {
      animation: toastOut 0.25s ease forwards;
    }

    /* Sidebar - transición mejorada */
    .sidebar {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }

    .menu-item {
      transition: background 0.18s ease, transform 0.12s ease, color 0.18s ease !important;
      position: relative;
      overflow: hidden;
    }

    .menu-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--sv-primario);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }

    .menu-item:active::after {
      opacity: 0.08;
    }

    /* ============================================================================
       INDICADOR DE TAREAS EN SEGUNDO PLANO
       ============================================================================ */
    #bgTaskIndicator {
      position: fixed;
      bottom: max(1rem, var(--sv-safe-bottom));
      right: max(1rem, var(--sv-safe-right));
      background: var(--sv-primario-oscuro);
      color: white;
      border-radius: 999px;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 0.5rem;
      z-index: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: slideUp 0.25s ease;
    }

    #bgTaskIndicator.visible {
      display: flex;
    }

    .bg-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    /* ============================================================================
       PIN LOCK — Módulo Facturación & Transferencias / ARCA
       ============================================================================ */
    .pin-lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 12, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10070;
      padding: max(1rem, var(--sv-safe-top)) max(1rem, var(--sv-safe-right)) max(1rem, var(--sv-safe-bottom)) max(1rem, var(--sv-safe-left));
    }
    .pin-lock-overlay.active { display: flex; }
    .pin-lock-card {
      background: var(--sv-superficie);
      border-radius: var(--sv-radius);
      padding: 2rem 1.5rem 1.5rem;
      width: 100%;
      max-width: 320px;
      text-align: center;
      animation: scaleIn 0.25s ease;
    }
    .pin-lock-card.shake { animation: pinShake 0.4s; }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .pin-lock-icon { font-size: 2.25rem; margin-bottom: 0.4rem; }
    .pin-lock-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; }
    .pin-lock-subtitle { font-size: 0.78rem; color: var(--sv-texto-secundario); margin-bottom: 1.25rem; line-height: 1.3; }
    .pin-lock-dots { display: flex; justify-content: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .pin-lock-dot {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--sv-borde);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .pin-lock-dot.filled { background: var(--sv-primario); border-color: var(--sv-primario); transform: scale(1.15); }
    .pin-lock-error { color: var(--sv-peligro); font-size: 0.78rem; min-height: 1.3rem; margin-bottom: 0.5rem; font-weight: 600; }
    .pin-lock-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin-bottom: 0.75rem;
    }
    .pin-lock-key {
      min-height: var(--sv-touch-target, 44px);
      border-radius: var(--sv-radius);
      border: 1px solid var(--sv-borde);
      background: var(--sv-superficie-elevada);
      color: var(--sv-texto);
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .pin-lock-key:active { background: var(--sv-primario); color: #fff; }
    .pin-lock-cancel {
      margin-top: 0.25rem;
      background: none;
      border: none;
      color: var(--sv-texto-secundario);
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
      min-height: var(--sv-touch-target, 44px);
    }

    /* ============================================================================
       INLINE LOADING - Spinner para Saldos
       ============================================================================ */
    .sv-inline-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--sv-borde);
      border-top-color: var(--sv-primario);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.6rem;
    }
    .sv-inline-loading {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--sv-texto-secundario);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo">🌿 Sol & Verde</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- PIN LOCK: Facturación & Transferencias / Emitir Comprobante ARCA -->
  <div class="pin-lock-overlay no-print" id="pinLockOverlay">
    <div class="pin-lock-card" id="pinLockCard">
      <div class="pin-lock-icon">🔒</div>
      <div class="pin-lock-title">Acceso Protegido</div>
      <div class="pin-lock-subtitle">Ingresá el PIN de 4 dígitos para acceder a Facturación &amp; Transferencias</div>
      <div class="pin-lock-dots" id="pinLockDots">
        <div class="pin-lock-dot"></div>
        <div class="pin-lock-dot"></div>
        <div class="pin-lock-dot"></div>
        <div class="pin-lock-dot"></div>
      </div>
      <div class="pin-lock-error" id="pinLockError"></div>
      <div class="pin-lock-keypad">
        <button type="button" class="pin-lock-key" onclick="_pinDigito('1')">1</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('2')">2</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('3')">3</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('4')">4</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('5')">5</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('6')">6</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('7')">7</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('8')">8</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('9')">9</button>
        <button type="button" class="pin-lock-key" onclick="_pinLimpiar()" aria-label="Borrar todo">C</button>
        <button type="button" class="pin-lock-key" onclick="_pinDigito('0')">0</button>
        <button type="button" class="pin-lock-key" onclick="_pinBorrar()" aria-label="Borrar último dígito">&#9003;</button>
      </div>
      <button type="button" class="pin-lock-cancel" onclick="_pinCancelar()">Cancelar y volver al inicio</button>
    </div>
  </div>

  <!-- App Container -->
  <div id="appContainer">
    <!-- Header -->
    <header class="app-header">
      <button class="header-btn" onclick="toggleSidebar()" title="Menú">
        <i class="fas fa-bars"></i>
      </button>
      <div class="header-logo" onclick="navegarA('dashboard')" title="Ir al Dashboard">
        <div class="header-logo-text">Sol & Verde</div>
      </div>
      <button class="header-btn" onclick="toggleTheme()" title="Tema">
        <i class="fas fa-moon"></i>
      </button>
    </header>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar collapsed" id="sidebar">
      <div class="menu-section">
        <div class="menu-section-title">Principal</div>
        <div class="menu-item active" onclick="navegarA('dashboard')">
          <i class="fas fa-chart-line menu-icon"></i>
          <span>Dashboard</span>
        </div>
        <div class="menu-item" onclick="navegarA('clientes')">
          <i class="fas fa-users menu-icon"></i>
          <span>Clientes</span>
        </div>
        <div class="menu-item" onclick="navegarA('movimientos')">
          <i class="fas fa-exchange-alt menu-icon"></i>
          <span>Movimientos</span>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">Operaciones</div>
        <div class="menu-item" onclick="navegarA('caja')">
          <i class="fas fa-cash-register menu-icon"></i>
          <span>Caja</span>
        </div>
        <div class="menu-item" onclick="navegarA('facturacion-unificada')">
          <i class="fas fa-file-invoice-dollar menu-icon"></i>
          <span>Facturación</span>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">Admin</div>
        <div class="menu-item" onclick="navegarA('configuracion')">
          <i class="fas fa-cog menu-icon"></i>
          <span>Configuración</span>
        </div>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Módulos se cargan aquí dinámicamente -->
    </main>
  </div>

  <script>
    // ============================================================================
    // PIN LOCK — Módulo Facturación & Transferencias / ARCA
    // ============================================================================
    const SV_PIN_FACTURACION = '0000'; // ← EDITAR ESTE VALOR (tu PIN de 4 dígitos)

    const SV_MODULOS_PROTEGIDOS_PIN = ['facturacion-unificada', 'facturacion-arca'];

    const PinLock = {
      ingresado: '',
      intentosFallidos: 0,
      callbackPendiente: null,
      MAX_INTENTOS: 3,
      BLOQUEO_BASE_SEG: 30,
      _timerBloqueo: null,

      estaDesbloqueado: function() { return Estado._pinDesbloqueado === true; },
      requiere: function(modulo) { return SV_MODULOS_PROTEGIDOS_PIN.indexOf(modulo) !== -1; },

      solicitarAcceso: function(modulo, callback) {
        if (!this.requiere(modulo) || this.estaDesbloqueado()) { callback(); return; }
        this.callbackPendiente = callback;
        this._mostrarOverlay();
      },

      _bloqueadoHasta: function() {
        const v = sessionStorage.getItem('sv_pin_bloqueo_hasta');
        return v ? parseInt(v, 10) : 0;
      },
      _segundosRestantesBloqueo: function() {
        const restante = Math.ceil((this._bloqueadoHasta() - Date.now()) / 1000);
        return restante > 0 ? restante : 0;
      },
      _mostrarOverlay: function() {
        this.ingresado = '';
        this._renderDots();
        document.getElementById('pinLockOverlay').classList.add('active');
        const restante = this._segundosRestantesBloqueo();
        if (restante > 0) this._mostrarBloqueoTemporal(restante);
        else document.getElementById('pinLockError').textContent = '';
      },
      _mostrarBloqueoTemporal: function(segundos) {
        const errEl = document.getElementById('pinLockError');
        const self = this;
        if (this._timerBloqueo) clearInterval(this._timerBloqueo);
        let restante = segundos;
        errEl.textContent = 'Demasiados intentos. Esperá ' + restante + 's...';
        this._timerBloqueo = setInterval(function() {
          restante--;
          if (restante <= 0) {
            clearInterval(self._timerBloqueo);
            errEl.textContent = '';
            sessionStorage.removeItem('sv_pin_bloqueo_hasta');
          } else {
            errEl.textContent = 'Demasiados intentos. Esperá ' + restante + 's...';
          }
        }, 1000);
      },
      digito: function(d) {
        if (this._segundosRestantesBloqueo() > 0) return;
        if (this.ingresado.length >= 4) return;
        this.ingresado += d;
        this._renderDots();
        if (this.ingresado.length === 4) {
          const self = this;
          setTimeout(function() { self._verificar(); }, 120);
        }
      },
      borrar: function() { this.ingresado = this.ingresado.slice(0, -1); this._renderDots(); },
      limpiar: function() { this.ingresado = ''; this._renderDots(); },
      _renderDots: function() {
        const dots = document.querySelectorAll('#pinLockDots .pin-lock-dot');
        dots.forEach((dot, i) => dot.classList.toggle('filled', i < this.ingresado.length));
      },
      _verificar: function() {
        if (this.ingresado === SV_PIN_FACTURACION) {
          this.intentosFallidos = 0;
          sessionStorage.removeItem('sv_pin_bloqueo_hasta');
          Estado._pinDesbloqueado = true;
          this._ocultarOverlay();
          const cb = this.callbackPendiente;
          this.callbackPendiente = null;
          if (cb) cb();
        } else {
          this.intentosFallidos++;
          this.ingresado = '';
          this._renderDots();
          const card = document.getElementById('pinLockCard');
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          if (this.intentosFallidos > 0 && this.intentosFallidos % this.MAX_INTENTOS === 0) {
            const nivel = Math.floor(this.intentosFallidos / this.MAX_INTENTOS);
            const segundos = this.BLOQUEO_BASE_SEG * Math.pow(2, nivel - 1);
            sessionStorage.setItem('sv_pin_bloqueo_hasta', String(Date.now() + segundos * 1000));
            this._mostrarBloqueoTemporal(segundos);
          } else {
            document.getElementById('pinLockError').textContent =
              'PIN incorrecto (' + (this.intentosFallidos % this.MAX_INTENTOS || this.MAX_INTENTOS) + '/' + this.MAX_INTENTOS + ')';
          }
        }
      },
      _ocultarOverlay: function() {
        document.getElementById('pinLockOverlay').classList.remove('active');
        document.getElementById('pinLockError').textContent = '';
        this.ingresado = '';
        this._renderDots();
      },
      cancelar: function() {
        this.callbackPendiente = null;
        this._ocultarOverlay();
        navegarA('dashboard');
      }
    };

    function _pinDigito(d) { PinLock.digito(d); }
    function _pinBorrar()  { PinLock.borrar(); }
    function _pinLimpiar() { PinLock.limpiar(); }
    function _pinCancelar(){ PinLock.cancelar(); }

    function navegarA(modulo) {
      if (PinLock.requiere(modulo) && !PinLock.estaDesbloqueado()) {
        PinLock.solicitarAcceso(modulo, function() { navegarA(modulo); });
        return;
      }

      // Verificar que existe el módulo
      const targetModule = document.getElementById('module-' + modulo);
      if (!targetModule) {
        console.warn('Módulo no encontrado:', modulo);
        return;
      }

      // Resto de la lógica de navegación aquí...
      console.log('Navegando a:', modulo);
    }

    // Escape para cerrar modales y PIN lock
    document.addEventListener('keydown', function(e) {
      const overlay = document.getElementById('pinLockOverlay');
      if (!overlay || !overlay.classList.contains('active')) return;
      if (e.key >= '0' && e.key <= '9') { e.preventDefault(); PinLock.digito(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); PinLock.borrar(); }
      else if (e.key === 'Escape') { e.preventDefault(); PinLock.cancelar(); }
    });

    // Estado global
    const Estado = {
      _pinDesbloqueado: false
    };

    // Funciones UI básicas
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    // Inicializar tema
    window.addEventListener('DOMContentLoaded', function() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('appContainer').classList.add('visible');
      document.getElementById('splashScreen').classList.add('hidden');
    });
  </script>
</body>
</html>
